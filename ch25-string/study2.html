<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>string 문자 데이터</title>
</head>
<body>
    <h1>문자데이터</h1>
    <p>자바스크립트에서 문자 데이터를 표현하기 위해서는 내용의 앞뒤로 쌍따옴표/홑따옴표/백틱을 사용해야 한다.</p>
    <p>문자 데이터끼리 더하면 이어진다.</p>
    <script>
        console.log("권오영")
        console.log("권"+"오"+"영")
        console.log("권오영".length)
        console.log("권"+"오"+"영".length)
        console.log(("권"+"오"+"영").length)
        console.log("권오영"[0])
        console.log("권오영"[1])
        console.log("권오영"[2])
        console.log(" 권오영"[0])
        console.log("박효신"[2]+"브루노 마스"[4]+"요네츠 켄시"[1])
    </script>
</body>
</html>
