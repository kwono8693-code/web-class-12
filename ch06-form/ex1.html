        <h1>로그인</h1>
        <div>
            <h2>Wavve 계정으로 로그인</h2>
            <form action="#">
                <div>
                    <label for="user-id">아이디</label>
                    <input type="text" id="user-id" placeholder="이메일 주소 또는 아이디" required>
                </div>
                <div>
                    <label for="user-pw">비밀번호</label>
                    <input type="password" id="user-pw" placeholder="비밀번호" required>
                </div>
                <div>
                    <input type="checkbox" id="user-save-id">
                    <label for="user-save-id">아이디 저장</label>
                    <input type="checkbox" id="login-auto">
                    <label for="login-auto">자동 로그인</label>
                </div>
                <button type="submit">로그인</button>
            </form>
            <ul>
                <li><a href="#" target="_blank">아이디 찾기</a></li>
                <li><a href="#" target="_blank">비밀번호 재설정</a></li>
                <li><a href="#" target="_blank">회원가입</a></li>
            </ul>
        </div>
        <div>
            <h2>또는 다른 서비스 계정으로 로그인</h2>
            <ul>

                <li><a href="#" target="_blank"><img src="./img/ico-common-apple.png" alt="애플로 로그인"></a></li>
            </ul>
