<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제 2</title>
</head>
<body>
    <form action="#">
        <h2>CREATE YOUR ACCOUNT</h2>
        <div>
            <label for="user-email">Email Address</label><br>
            <input type="text" id="user-email" required>
        </div><br>
        <div>
            <label for="user-email-confirm">Confirm your Address</label><br>
            <input type="text" id="user-email-confirm" required>
        </div><br>
        <div>
            <label for="country-residence">Country of Residence</label><br>
            <select id="country-residence">
                <option value="Korea, Republic of" selected>Korea, Republic of</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Australia">Australia</option>
                <option value="Canada">Canada</option>
            </select>
        </div><br>
        <div id="captcha">
        </div><br>
        <div>
            <input type="checkbox" id="agree"><label for="agree">I am 13 years of age or older and agree to the terms of the <strong>Steam Subscriber Agreement</strong> and the <strong>Valve Privacy Policy.</strong></label>
        </div><br>
        <button type="submit">Continue</button>
    </form>
</body>
</html>
