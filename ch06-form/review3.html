    <form action="#">
        <fieldset>
            <legend>계정 정보</legend>
            <div>
                <label for="user-id">아이디:</label>
                <input type="text" name="id" id="user-id" placeholder="아이디" required>
            </div>
            <div>
                <label for="user-pw">비밀번호:</label>
                <input type="password" name="password" id="user-pw" placeholder="비밀번호" required>
            </div>
            <div>
                <label for="confirm-pw">비밀번호 확인:</label>
                <input type="password" name="confirm-password" placeholder="비밀번홓 확인" id="confrim-pw">
            </div>
        </fieldset>
        <fieldset>
            <legend>개인 정보</legend>
            <div>
                <label for="user-name">이름:</label>
                <input type="text" name="name" id="user-name">
            </div>
            <div>
                <label>성별</label>
                <input type="radio" id="user-male" name="user-gender"><label for="user-male">남</label>
                <input type="radio" id="user-female" name="user-gender"><label for="user-female">여</label>
                <input type="radio" id="user-noselect" name="user-gender" checked><label for="user-noselect">선택 안 함</label>
            </div>
            <div>
                <label for="user-birth">생년월일</label>
                <input type="date" id="user-birth">
            </div>
        </fieldset>
    </form>
</body>
