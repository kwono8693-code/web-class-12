<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>값의 형태로 저장하는 함수</title>
</head>
<body>
    <script>
        function a(){
            alert("aaa")
        }
        // let a = 2; / function a는 a에 함수를 저장한다는 의미가 되므로 let a = 2;처럼 변수 선언이 안 된다.
        let b = function(){
            alert("bbb")
        } // 이름이 없는 함수 -> 익명 함수라고 한다. 함수를 정의할 수 있다.
        // b()

        let c = ()=>{
            alert("ccc")
        }
        c()

        function d(n1){
            alert(n1)
        }
        d("ddd")

        let e = function(n1){
            alert(n1)
        }
        e("eee")

        let f = n1 => {
            alert(n1)
        }
        f("fff")
        // 매개 변수가 하나일 때 소괄호 생략 가능

        let g = (a,b) => [a,b]
        alert(g(1,3)) //소스코드가 한 줄일 때 중괄호와 return 생략 가능
    </script>
    <h1>콜백함수</h1>
    <script>
        function aa(bb){
            // bb = function(){} 내부적으로 이런 변수가 정의된다.
            bb()
        }
        aa(function(){
            alert("bb")
        }) //aa 함수를 실행할 때 익명 함수도 실행된다.
        let cc = dd=>{
            dd()
        }
        cc(()=>{
            alert("dd")
        })
    </script>
</body>
</html>
