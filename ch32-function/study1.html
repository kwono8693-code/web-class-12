<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fuction - 함수</title>
</head>
<body>
    <h1>함수</h1>
    <p>자바스크립트에서 동작을 표현하는 데이터 형태</p>
    <p>alert(), console.log() 등 기본적으로 브라우저에 설치되어 있는 표준내장함수들이 있고 직접 기능을 만드는 사용자 정의 함수가 있다.</p>
    <ol>
        <li>함수를 정의 - 정의부</li>
        <li>함수를 실행 - 호출부/실행부</li>
    </ol>
    <script>
        function a(){
            // 실행될 소스코드
            alert("test")
        }
        // a()
        // a()
        function b(){
            document.write("<h2>hello!</h2>")
        }
        b()
        b()

        function c(name="홍길동",age="10"){
            document.write("<p>"+name+"님 안녕하세요. "+age+"세군요!</p>")
            document.write(`${name}님은 ${age}살이군욤!`)
        }
        c()
        c("정현진",40) // "장현진"과 40은 "인자" / "정현진", 40을 매개로 해서 c 함수를 실행해라.
        c("최희정",10)

        function d(person=[2,"홍길동"]){
            document.write(`<h3>${person[0]}세 ${person[1]}님 반갑습니다.</h3>`)
        }
        d([45, "정현진"])

        function e(person){
            document.write(`<h3>${person.age}세 ${person.name}님 반갑습니다.</h3>`)
        }
        e({name:"홍길동", age:40})
        e({age:23, name:"장윤서"})
    </script>
</body>
</html>
