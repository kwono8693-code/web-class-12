<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>study2-review</title>
</head>
<body>
    <h1>for 문을 사용해서 구구단을 2단부터 9단까지 출력하시오</h1>
    <script>
        for(let i=2; i<10; i++){
            document.write(`<ul>`)
                for(let j=1; j<10; j++){
                    document.write(`<li>${i} x ${j} = ${i*j}</li>`)
                }
            document.write(`</ul>`)
        }
    </script>
    
</body>
</html>
