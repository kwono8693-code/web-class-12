<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반복문의 중첩</title>
    <link rel="stylesheet" href="./css/study2.css">
</head>
<body>

    <script>
        let col = prompt("몇 열로 구구단을 정렬할까요?")
        document.write(`<div class="box" style="grid-template-columns: repeat(${col},1fr);">`)
        for(let dan =2; dan<=9; dan++){
            document.write("<ul>")
                for(let i=1; i<=9; i++){
                    document.write(`<li>${dan} x ${i} = ${dan*i}</li>`)
                }
            document.write("</ul>")
        }
        document.write(`</div>`)
    </script>
    <!-- <h1>구구단 2단부터 9단까지 뽑기</h1>
    <ul>
        <li>2 x 1 = 2</li>
    </ul> -->
</body>
</html>
