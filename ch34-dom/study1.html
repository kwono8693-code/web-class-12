<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문서 객체 - Document Object Model</title>
</head>
<body>
    <h1>자바스크립트의 객체 시스템</h1>
    <p>자바스크립트는 브라우저 자체를 객체로 이해하고 있으며 최상위 객체를 window 객체라고 부른다.</p>
    <p>그리고 그 최상위 객체 window 아래에는 여러 객체들이 포함되어 있다.</p>
    <ul>
        <li>document -> 정보들을 표현하는 문서 객체</li>
        <li>location -> 웹페이지의 위치 정보를 표현하는 객체</li>
        <li>history -> 이동했던 페이지들에 대한 정보를 관리하는 객체</li>
        <li>console -> 개발자 툴에 있는 콘솔 객체</li>
        <li>navigator -> 브라우저의 정보를 담고 있는 객체</li>
    </ul>
    <script>
        console.log(window) // window는 기존에 만들어져 있던 변수 / window 객체가 저장돼 있다.
        // window.alert("안녕")
        // window.location.href = "https://www.naver.com"
        // location.reload()
        history.back()
        history.go(-1)
    </script>
</body>
</html>
