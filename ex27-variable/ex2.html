<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex2</title>
    <link rel="stylesheet" href="./css/ex2.css">
</head>
<body>
    <!-- <script>
        let userName = prompt("당신의 이름은 무엇입니가?")
        let userWeight = Number(prompt("당신의 몸무게는 몇 kg입니까?"));
        let userHeight = Number(prompt("당신의 키는 몇 cm입니까?"));
        let userBmi = (userWeight/Math.pow(userHeight/100,2)).toFixed(2)
    </script> -->
    <div class="wrap">
        <h1>나의 체질량 지수 (BMI)</h1>
        <p>체질량 지수는 자신의 몸무게(kg)를 키의 제곱(m)으로 나눈 값이다. 체질량 지수는 근육량, 유전적 원인, 다른 개인적 차이를 반영하지 못하는 단점이 있음에도 불구하고 의료인들이 가장 많이 쓰는 방법 중 하나이다.</p>
        <dl class="bmi-dl">
            <dt>이름</dt>
            <dd><script>document.write(""+userName+"")</script></dd>
            <dt>체중</dt>
            <dd><script>document.write(""+userWeight+"")</script></dd>
            <dt>키</dt>
            <dd><script>document.write(""+userHeight+"")</script></dd>
            <dt>bmi</dt>
            <dd><script>document.write(""+userBmi+"")</script></dd>
        </dl>
        <div class="bmigrp">
                <span class="t1">BMI</span>
                <span class="t2">체중</span>
                <section class="a">
                    저체중
                    <span class="t3">18.5</span>
                </section>
                <section class="b">
                    정상
                    <span class="t4">23</span>
                </section>
                <section class="c">
                    과체중
                    <span class="t5">25.00</span>
                </section>
                <section class="d">비만</section>
        </div>
    </div>
    <script>
        let userName = prompt("이름을 입력해 주세요.");
        let userWeight = Number(prompt("몸무게를 입력해 주세요."))
        let userHeight = Number(prompt("키를 입력해 주세요."))
        let bmi = (userWeight / Math.pow(userHeight/100,2)).toFixed(2)
        document.write(`
            <dl class="bmi-dl">
                <dt>이름</dt>
                <dd>${userName}</dd>
                <dt>체중</dt>
                <dd>${userWeight}kg</dd>
                <dt>키</dt>
                <dd>${userHeight}cm</dd>
                <dt>bmi</dt>
                <dd>${bmi}</dd>
            </dl>
        `)
    </script>
    <!-- 템플릿 문자 데이터 표현 방식(백틱) "++"< 기존의 방식 `++` < 백틱의 방식 ${} < 백틱 전용 문자 데이터 표현 방식 -->
</body>
</html>
