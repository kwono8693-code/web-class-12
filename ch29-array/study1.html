<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array - 배열</title>
</head>
<body>
    <p>연관된 데이터들을 모아 놓은 집합</p>
    <script>
        let a = ["사과","배","키위","블루베리"]; // "사과" (배열의 원소) 해당 배열 데이터에는 4개의 원소가 저장돼 있다. 원소의 개수는 무한대로 넣을 수 있다. "사과"가 가장 먼저 저장된 원소(0번 째 원소) 데이터이며 처럼 순번을 정하여 부를 수 있다. 배열에서는 저장하는 순서가 중요하다. 저장하는 순서대로 배열 데이터의 원소의 순번이 결정된다.
        a[0]; // [] -> 순번 대괄호라고 하고 인덱스 박스라 부른다.
        console.log(a[0]);
        console.log(a[2]);
        a[4]; // -> 정해진 값이 없기 때문에 undefined가 출력된다.
        a.length 
        console.log(a.length); // 원소가 4개 저장돼 있는 배열 데이터이기 때문에 4가 출력된다.
        console.log(a[0][1]); // a[0] => "사과" / "사과"[1] => "과"
        "권오영"[0] // 문자라고 하지 않고 문자열이라고 한다. 여러 개의 문자가 뜻을 모여서 문자열이라고 한다.
        // let b =[1,2,3,4];
        // let b =[1,2,3,4][3]; // b라는 데이터에 4가 저장된다.
        let b =[
            1,
            2,
            3,
            4
        ][3];
        a[b[3]]; // undefined
        a[b[3]? 1 : 2]; // "배"
        
        let c = [
            "장윤서",
            "이은지",
            "김선영",
            "김가희",
            "최예슬"
        ];
        c[0]; // "장윤서"
        c[4]; // "최예슬"
        c[1].length; // 3
        c[2][1]+c[3][2]; //"선희"
        (!c[3]||!c[4]||c[1])[0]; // (!c[3]||!c[4]||!c[1])[0]; -> 이 값이어도 마지막 !c[1]이 출력된다.

        let d = 0||0||1;
        console.log(d);

        let f = 0||0||0; // f에는 0이 저장됨

        let person1 = [
            "정현진",
            "남자",
            "INFP",
            170,
            77,
            false,
            ["게임","독서","러닝"]
        ];
        person1[0]; // "정현진"
        person1[3]; // 170
        person1[5]? "기혼" : "미혼"; // "미혼"
        person1[6][2]; // "러닝"
        person1[6][2][1]; // "닝"
    </script>
</body>
</html>
