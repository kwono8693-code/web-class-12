<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학관련도구(함수)</title>
</head>
<body>
    <h1>수학 계산 함수</h1>
    <script>
        // 올림 함수
        Math.ceil(5.33)
        console.log(Math.ceil(5.33))
        // 내림 함수
        Math.floor(5.99)
        console.log(Math.floor(5.99))
        // 반올림 함수
        Math.round(5.5)
        console.log(Math.round(5.5))
        // 지수? 제곱 함수
        Math.pow(10,2)
        console.log(Math.pow(10,2))
        // 루트 함수
        Math.sqrt(100)
        console.log(Math.sqrt(100))
        // 절대값 계산 함수
        Math.abs(-30)
        console.log(Math.abs(-30))
        // 가장 큰 값만 나타내는 함수
        Math.max(1,2,3,4,5,6)
        console.log(Math.max(1,2,3,4,5,6))
        // 가장 작은 값만 나타내는 함수
        Math.min(1,2,3)
        console.log(Math.min(1,2,3))
        // 난수(0~1 사이의 무작위 숫자 추출)
        Math.random()
        console.log(Math.random())
        // 소수점자리 표현 -> 문자데이터로 변환된다. "123.333"
        123.3333231423.toFixed(3)
        console.log(123.3333231423.toFixed(3))
    </script>
</body>
</html>
